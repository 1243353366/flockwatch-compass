[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flockwatch"
version = "0.1.0"
description = "Unified Flock camera detection, data fusion, and RF fingerprinting toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "FlockWatch Contributors"}]
keywords = ["flock", "alpr", "surveillance", "detection", "sdr", "wifi", "ble", "wigle", "rf-fingerprinting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "folium>=0.15",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
sdr = ["pyrtlsdrlib>=0.1", "matplotlib>=3.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
flockwatch = "flockwatch.cli:main"

[tool.setuptools.packages.find]
include = ["flockwatch*"]

[tool.setuptools.package-data]
flockwatch = ["data/signatures/*.yaml"]
