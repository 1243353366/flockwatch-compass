name = "corpora-ai"
main = "src/index.js"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]
account_id = "586f298a211c493ff5633233b09c9cd5"
workers_dev = true
minify = true
send_metrics = false

[observability]
enabled = true

[ai]
binding = "AI"

# The existing DB binding owns both the corpus index and additive AI memory tables.
# A separate AI_DB binding can be added after the account has a D1 database with
# that name; the Worker safely falls back to DB until then.
[[d1_databases]]
binding = "DB"
database_name = "blog_db"
database_id = "038c5843-0c9d-43ea-8347-b8840768b95d"
